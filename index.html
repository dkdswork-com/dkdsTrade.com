<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="Private, local-first trading journal">
<link rel="manifest" href="manifest.json">
<title>📓 Trade Memo Private</title>
<style>
:root{
 --bg:#0b1220;--bg2:#0f1728;--card:#121c2f;--card2:#18243a;--line:#273652;
 --text:#edf3ff;--muted:#8ea1bf;--accent:#6eb0ff;--pos:#48d597;--neg:#ff6c83;--warn:#ffc45c;
 --shadow:0 12px 35px rgba(0,0,0,.18);--radius:16px;
}
:root[data-theme="light"]{
 --bg:#f4f7fb;--bg2:#eef3f9;--card:#fff;--card2:#f4f7fb;--line:#dce4ef;
 --text:#142033;--muted:#64748b;--accent:#2c73d2;--pos:#008c5a;--neg:#d43c56;--warn:#b36d00;
 --shadow:0 8px 28px rgba(28,51,84,.09);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",sans-serif;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:var(--accent)}
#app{min-height:100vh}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:color-mix(in srgb,var(--bg) 92%,transparent);border-right:1px solid var(--line);padding:20px 14px;backdrop-filter:blur(12px)}
.brand{font-weight:850;font-size:19px;padding:8px 10px 22px}.brand small{font-weight:500;color:var(--muted)}
.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:12px;text-align:left}.nav button:hover,.nav button.on{background:var(--card2);color:var(--text)}
.side-note{font-size:11px;line-height:1.5;color:var(--muted);margin:24px 10px}
.main{width:100%;max-width:1420px;margin:auto;padding:22px 24px 38px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.top h1{font-size:24px;margin:0}.top-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:grid;gap:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.card-head h2,.card-head h3{margin:0;font-size:16px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 12px;border-radius:10px}.btn:hover{background:var(--card2)}.btn.primary{background:var(--accent);border-color:transparent;color:#07111f;font-weight:750}.btn.soft{background:color-mix(in srgb,var(--accent) 12%,var(--card))}.btn.danger{background:color-mix(in srgb,var(--neg) 11%,var(--card));border-color:color-mix(in srgb,var(--neg) 40%,var(--line));color:var(--neg)}.btn.small{padding:7px 10px;font-size:12px}.iconbtn{width:38px;height:38px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px}
.muted,.dim{color:var(--muted)}.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}.tiny{font-size:10px}.small{font-size:12px}.pill{display:inline-block;border:1px solid var(--line);background:var(--card2);padding:2px 7px;border-radius:999px;font-size:11px}
.dayhead{display:grid;grid-template-columns:40px 1fr auto 40px;gap:10px;align-items:center}.dayhead .title h1{margin:0;font-size:21px}.dayhead .title .sub{font-size:12px;color:var(--muted);margin-top:4px}.dayhead input{border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 10px;border-radius:10px}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.weekstrip button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 5px;min-height:63px;color:var(--muted);display:grid;place-items:center}.weekstrip button.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--card));color:var(--text)}.weekstrip .d{font-weight:800;font-size:16px}.weekstrip .v{font-size:11px;font-weight:700}.dot{width:5px;height:5px;background:var(--accent);border-radius:50%}.hide{visibility:hidden}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--line);background:var(--card2);color:var(--muted);border-radius:999px;padding:8px 11px}.chip.on{color:var(--text);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card2))}
.field{display:grid;gap:6px}.field span{font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg2);color:var(--text);border-radius:10px;padding:9px 10px;outline:none}.field textarea{min-height:82px;resize:vertical}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.tile{border:1px solid var(--line);background:var(--card2);border-radius:13px;padding:13px}.tile .l{font-size:11px;color:var(--muted);display:block}.tile .v{font-size:22px;font-weight:850;margin-top:5px;display:block}.tile .s{font-size:11px;color:var(--muted);display:block;margin-top:3px}.tile.hero{grid-column:span 2;display:flex;align-items:center;gap:15px}
.donut{width:94px;height:94px;position:relative;flex:none}.donut svg{width:100%;height:100%;transform:rotate(-90deg)}.donut .center{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;font-weight:850}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px 8px;border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap;text-align:left}.table th{color:var(--muted);font-weight:600}.table tr.clickable{cursor:pointer}.table tr.clickable:hover{background:var(--card2)}
.trade-row{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.trade-row:last-child{border-bottom:0}.trade-row .sym{font-weight:800}.trade-row .meta{font-size:11px;color:var(--muted)}.trade-row .pl{text-align:right;font-weight:850}
.imgs{display:flex;flex-wrap:wrap;gap:8px}.img{position:relative;width:132px;height:82px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg2)}.img img{width:100%;height:100%;object-fit:cover}.img .del{position:absolute;right:4px;top:4px;width:25px;height:25px;border:0;border-radius:50%;background:rgba(0,0,0,.62);color:#fff}.img-add{width:132px;height:82px;border:1px dashed var(--line);border-radius:10px;background:transparent;color:var(--muted)}
.chartbox{overflow:auto;border-radius:12px;background:var(--bg2);padding:5px}.chart{width:100%;min-width:600px;height:220px;display:block}.chart .grid{stroke:var(--line);stroke-width:1}.chart .tick{fill:var(--muted);font-size:10px}.chart .zero{stroke:var(--muted);stroke-dasharray:3 3}.chart .line{fill:none;stroke:var(--accent);stroke-width:3}.chart .area{fill:color-mix(in srgb,var(--accent) 12%,transparent)}.chart .bar.pos{fill:var(--pos)}.chart .bar.neg{fill:var(--neg)}.chart .bar.flat{fill:var(--muted)}
.periodbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.seg{display:flex;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px}.seg button{border:0;background:transparent;color:var(--muted);padding:8px 11px;border-radius:8px}.seg button.on{background:var(--card2);color:var(--text);font-weight:700}.periodnav{display:flex;align-items:center;gap:7px}.periodnav .lbl{font-size:13px;font-weight:700;min-width:190px;text-align:center}
.cal .head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:5px}.cal .head span{font-size:10px;color:var(--muted);padding:4px 6px}.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.calcell{min-height:84px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);padding:7px;display:flex;flex-direction:column;align-items:flex-start;color:var(--text)}.calcell.empty{visibility:hidden}.calcell .d{font-size:11px;color:var(--muted)}.calcell .v{margin-top:auto;font-weight:800;font-size:12px}.calcell.pos{box-shadow:inset 0 -4px 0 color-mix(in srgb,var(--pos) calc(var(--i)*100%), transparent)}.calcell.neg{box-shadow:inset 0 -4px 0 color-mix(in srgb,var(--neg) calc(var(--i)*100%), transparent)}.calcell.noted{box-shadow:inset 0 -4px 0 var(--accent)}
.modal{position:fixed;inset:0;background:rgba(4,8,15,.72);display:grid;place-items:center;padding:18px;z-index:100}.modal[hidden]{display:none}.modal-card{width:min(740px,100%);max-height:92vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}.modal-card.wide{width:min(1120px,100%)}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.notice{border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));background:color-mix(in srgb,var(--warn) 9%,var(--card));padding:11px;border-radius:12px;font-size:12px;line-height:1.55}
.toast{position:fixed;right:16px;bottom:16px;z-index:200;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 13px;box-shadow:var(--shadow);font-size:12px}.toast.ok{border-color:color-mix(in srgb,var(--pos) 45%,var(--line))}.toast.err{border-color:color-mix(in srgb,var(--neg) 45%,var(--line))}
details{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg2)}summary{cursor:pointer;color:var(--muted)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
hr{border:0;border-top:1px solid var(--line);margin:4px 0}
@media(max-width:1100px){.tiles{grid-template-columns:repeat(2,1fr)}.tile.hero{grid-column:span 2}.grid4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:850px){.shell{grid-template-columns:1fr}.sidebar{position:sticky;bottom:0;top:auto;height:auto;z-index:90;border-right:0;border-top:1px solid var(--line);padding:7px}.brand,.side-note{display:none}.nav{grid-template-columns:repeat(3,1fr)}.nav button{text-align:center;padding:9px 6px;font-size:11px}.main{padding:14px}.grid2,.grid3{grid-template-columns:1fr}.dayhead{grid-template-columns:38px 1fr 38px}.dayhead input{grid-column:2}.periodnav .lbl{min-width:140px}.formgrid{grid-template-columns:1fr}}
@media(max-width:560px){.tiles,.grid4{grid-template-columns:1fr}.tile.hero{grid-column:auto}.top{align-items:flex-start;flex-direction:column}.top-actions{width:100%}.weekstrip button{min-height:56px}.calcell{min-height:63px}.trade-row{grid-template-columns:70px 1fr}.trade-row .pl{grid-column:2;text-align:left}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal" hidden><div id="modalCard" class="modal-card"></div></div>
<div id="toast" class="toast" hidden></div>
<script>
(() => {
'use strict';

const DB = 'trade-memo-private-v2';
const VER = 1;
const today = () => new Date().toISOString().slice(0,10);
const fmtDate = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseDate = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const monday = d => { const x=new Date(d); const n=(x.getDay()+6)%7; x.setDate(x.getDate()-n); x.setHours(0,0,0,0); return x; };
const THM=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const THMF=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const THD=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์'];
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (n,cur) => { if(!Number.isFinite(Number(n))) return '∞'; const x=Number(n); return `${x<0?'-':''}${Math.abs(x).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}${cur?' '+cur:''}`; };
const signed=(n,cur)=>`${Number(n)>0?'+':''}${money(n,cur)}`;
const num=(x)=>{const n=Number(x);return Number.isFinite(n)?n:0};
const uid=()=>crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`;
const $=(q,r=document)=>r.querySelector(q), $$=(q,r=document)=>[...r.querySelectorAll(q)];
let db, state={
 view:'diary', date:today(), period:'month', anchor:today(), cal:new Date(),
 day:null, days:[], settings:{currency:'USD',startingBalance:0,theme:'dark',driveClientId:'',driveFolderName:'Trade Memo',claudeKey:'',claudeModel:'',geminiKey:'',geminiModel:'',lastSymbol:'',lastSync:''},
 objectUrls:new Map()
};

function toast(msg,type=''){const e=$('#toast');e.textContent=msg;e.className='toast '+type;e.hidden=false;clearTimeout(e._t);e._t=setTimeout(()=>e.hidden=true,type==='err'?5200:2600);}
function openModal(html,wide=false){const m=$('#modal'),c=$('#modalCard');c.className='modal-card'+(wide?' wide':'');c.innerHTML=html;m.hidden=false;document.body.style.overflow='hidden';return c;}
function closeModal(){const m=$('#modal'),c=$('#modalCard');m.hidden=true;c.innerHTML='';c._onPaste=null;document.body.style.overflow='';}
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});

function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,VER);r.onupgradeneeded=()=>{const d=r.result;
 if(!d.objectStoreNames.contains('days'))d.createObjectStore('days',{keyPath:'date'});
 if(!d.objectStoreNames.contains('images'))d.createObjectStore('images',{keyPath:'id'});
 if(!d.objectStoreNames.contains('settings'))d.createObjectStore('settings',{keyPath:'key'});
};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
const store=(name,mode='readonly')=>db.transaction(name,mode).objectStore(name);
const get= (name,key)=>new Promise((res,rej)=>{const r=store(name).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const all= name=>new Promise((res,rej)=>{const r=store(name).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)});
const put=(name,val)=>new Promise((res,rej)=>{const r=store(name,'readwrite').put(val);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)});
const del=(name,key)=>new Promise((res,rej)=>{const r=store(name,'readwrite').delete(key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)});

function blankDay(date){return {date,createdAt:Date.now(),updatedAt:Date.now(),plan:{bias:'',setup:'',entryRules:'',riskNotes:''},review:{mood:'',notes:''},trades:[]};}
async function getDay(date){let d=await get('days',date);if(!d){d=blankDay(date);await put('days',d)}return d}
async function loadData(){await openDB();state.days=await all('days');const ss=await all('settings');for(const x of ss)state.settings[x.key]=x.value;document.documentElement.dataset.theme=state.settings.theme||'dark';}

function tradeNet(t){return num(t.pnl)+num(t.commission)+num(t.swap);}
function metrics(trades){
 const nets=trades.map(tradeNet), wins=nets.filter(n=>n>0), losses=nets.filter(n=>n<0);
 const grossWin=wins.reduce((a,b)=>a+b,0), grossLoss=Math.abs(losses.reduce((a,b)=>a+b,0));
 let peak=0,cum=0,maxDD=0,curW=0,curL=0,maxW=0,maxL=0;
 nets.forEach(n=>{cum+=n;if(cum>peak)peak=cum;maxDD=Math.max(maxDD,peak-cum);if(n>0){curW++;curL=0}else if(n<0){curL++;curW=0}else{curW=0;curL=0}maxW=Math.max(maxW,curW);maxL=Math.max(maxL,curL)});
 const decided=wins.length+losses.length, net=grossWin-grossLoss;
 return {total:trades.length,wins:wins.length,losses:losses.length,be:nets.filter(n=>n===0).length,winrate:decided?wins.length/decided:0,grossWin,grossLoss,net,
 profitFactor:grossLoss?grossWin/grossLoss:(grossWin?Infinity:0),expectancy:trades.length?net/trades.length:0,
 avgWin:wins.length?grossWin/wins.length:0,avgLoss:losses.length?grossLoss/losses.length:0,rr:losses.length?(wins.length?grossWin/wins.length/(grossLoss/losses.length):0):(grossWin?Infinity:0),
 maxDD,maxWinStreak:maxW,maxLossStreak:maxL,best:nets.length?Math.max(...nets):0,worst:nets.length?Math.min(...nets):0,lots:trades.reduce((a,t)=>a+num(t.lots),0)}
}
function tradesInRange(days,start,end){const s=fmtDate(start),e=fmtDate(end);return days.filter(d=>d.date>=s&&d.date<=e).flatMap(d=>(d.trades||[]).map(t=>({...t,date:d.date}))).sort((a,b)=>(a.date+(a.exitTime||a.entryTime||'')).localeCompare(b.date+(b.exitTime||b.entryTime||'')));}
function range(period,anchor){
 const a=parseDate(anchor);
 if(period==='day')return {start:a,end:a,label:anchor};
 if(period==='week'){const s=monday(a),e=addDays(s,6);return {start:s,end:e,label:`สัปดาห์ ${isoWeek(a)} (${fmtDate(s)} – ${fmtDate(e)})`}}
 if(period==='month'){return {start:new Date(a.getFullYear(),a.getMonth(),1),end:new Date(a.getFullYear(),a.getMonth()+1,0),label:`${THMF[a.getMonth()]} ${a.getFullYear()}`}}
 if(period==='year')return {start:new Date(a.getFullYear(),0,1),end:new Date(a.getFullYear(),11,31),label:`ปี ${a.getFullYear()}`};
 return {start:new Date(2000,0,1),end:new Date(2100,0,1),label:'ทั้งหมด'};
}
function isoWeek(d){const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-day);const ys=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil((((x-ys)/86400000)+1)/7)}
function shift(period,anchor,dir){const a=parseDate(anchor);if(period==='day')return fmtDate(addDays(a,dir));if(period==='week')return fmtDate(addDays(a,7*dir));if(period==='month')return fmtDate(new Date(a.getFullYear(),a.getMonth()+dir,Math.min(a.getDate(),28)));if(period==='year')return fmtDate(new Date(a.getFullYear()+dir,a.getMonth(),Math.min(a.getDate(),28)));return anchor}
function thDate(s,short=false){const d=parseDate(s);return short?`${d.getDate()} ${THM[d.getMonth()]}`:`${THD[d.getDay()]} ${d.getDate()} ${THMF[d.getMonth()]} ${d.getFullYear()}`}

function drawLine(points,w=900,h=230){if(!points.length)return `<div class="muted" style="padding:45px;text-align:center">ยังไม่มีข้อมูล</div>`;
 const W=w,H=h,pl=55,pr=15,pt=15,pb=30,vals=points.map(p=>p.cum),lo=Math.min(0,...vals),hi=Math.max(0,...vals),rg=(hi-lo)||1;
 const x=i=>pl+(points.length===1?(W-pl-pr)/2:i/(points.length-1)*(W-pl-pr)),y=v=>pt+(1-(v-lo)/rg)*(H-pt-pb);
 let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" aria-label="equity curve">`;
 for(let i=0;i<5;i++){const v=lo+(hi-lo)*i/4,yy=y(v);s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}"/><text class="tick" x="${pl-7}" y="${yy+4}" text-anchor="end">${Math.abs(v)>=1000?(v/1000).toFixed(1)+'k':v.toFixed(0)}</text>`}
 s+=`<line class="zero" x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}"/>`;
 const path=points.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.cum).toFixed(1)}`).join(' ');
 const area=path+` L${x(points.length-1)},${y(0)} L${x(0)},${y(0)} Z`;
 s+=`<path class="area" d="${area}"/><path class="line" d="${path}"/>`;
 const idx=[0,Math.floor((points.length-1)/2),points.length-1].filter((v,i,a)=>a.indexOf(v)===i);
 idx.forEach(i=>s+=`<text class="tick" x="${x(i)}" y="${H-8}" text-anchor="${i===0?'start':i===points.length-1?'end':'middle'}">${points[i].date.slice(5)}</text>`);
 return s+'</svg>';
}
function drawBars(items,w=900,h=210){if(!items.length)return `<div class="muted" style="padding:45px;text-align:center">ยังไม่มีข้อมูล</div>`;
 const W=w,H=h,pl=55,pr=15,pt=15,pb=30,vals=items.map(i=>i.value),lo=Math.min(0,...vals),hi=Math.max(0,...vals),rg=(hi-lo)||1,y=v=>pt+(1-(v-lo)/rg)*(H-pt-pb),slot=(W-pl-pr)/items.length,bw=Math.max(3,Math.min(26,slot*.65));
 let s=`<svg class="chart" viewBox="0 0 ${W} ${H}">`;for(let i=0;i<5;i++){const v=lo+(hi-lo)*i/4,yy=y(v);s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}"/><text class="tick" x="${pl-7}" y="${yy+4}" text-anchor="end">${v.toFixed(0)}</text>`}
 const y0=y(0),every=Math.max(1,Math.ceil(items.length/10));s+=`<line class="zero" x1="${pl}" x2="${W-pr}" y1="${y0}" y2="${y0}"/>`;
 items.forEach((it,i)=>{const cx=pl+slot*i+slot/2,yy=y(it.value),top=Math.min(y0,yy),hh=Math.max(2,Math.abs(yy-y0)),cl=it.value>0?'pos':it.value<0?'neg':'flat';s+=`<rect class="bar ${cl}" x="${cx-bw/2}" y="${top}" width="${bw}" height="${hh}" rx="3"/>`;if(i%every===0)s+=`<text class="tick" x="${cx}" y="${H-8}" text-anchor="middle">${esc(it.label)}</text>`});return s+'</svg>';
}
function donut(ratio){const p=Math.max(0,Math.min(1,ratio)),r=43,c=2*Math.PI*r,d=p*c;return `<div class="donut"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--pos)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${d} ${c-d}"/></svg><div class="center">${(p*100).toFixed(0)}%</div></div>`}
function calHtml(year,month,map){const first=new Date(year,month,1),days=new Date(year,month+1,0).getDate(),start=(first.getDay()+6)%7,max=Math.max(1,...[...map.values()].map(x=>Math.abs(x.net)));let h=`<div class="head">${['จ','อ','พ','พฤ','ศ','ส','อา'].map(x=>`<span>${x}</span>`).join('')}</div><div class="calgrid">`;for(let i=0;i<start;i++)h+=`<span class="calcell empty"></span>`;for(let d=1;d<=days;d++){const k=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,x=map.get(k),int=x?(.25+.75*Math.min(1,Math.abs(x.net)/max)):0;let cl='calcell';if(x&&x.count)cl+=x.net>0?' pos':x.net<0?' neg':'';else if(x&&x.hasNote)cl+=' noted';h+=`<button class="${cl}" style="--i:${int}" data-cal="${k}"><span class="d">${d}</span>${x&&x.count?`<span class="v ${x.net>=0?'pos':'neg'}">${x.net>=0?'+':''}${x.net.toFixed(0)}</span>`:''}</button>`}return h+'</div>'}
function groupTable(title, groups){return `<section class="card"><div class="card-head"><h3>${esc(title)}</h3></div>${groups.length?`<div class="table-wrap"><table class="table"><thead><tr><th></th><th>เทรด</th><th>Winrate</th><th>กำไร</th></tr></thead><tbody>${groups.map(g=>`<tr><td>${esc(g.label)}</td><td>${g.m.total}</td><td>${(g.m.winrate*100).toFixed(1)}%</td><td class="${g.m.net>=0?'pos':'neg'}"><b>${signed(g.m.net,state.settings.currency)}</b></td></tr>`).join('')}</tbody></table></div>`:'<div class="muted">ไม่มีข้อมูล</div>'}</section>`}
function group(trades,keyFn,labelFn){const m=new Map();trades.forEach(t=>{const k=keyFn(t);if(!m.has(k))m.set(k,[]);m.get(k).push(t)});return [...m.entries()].sort((a,b)=>String(a[0]).localeCompare(String(b[0]))).map(([k,v])=>({label:labelFn(k),m:metrics(v),trades:v}))}


function setupOptions(){
  const base=['QM','Double Top','Double Bottom','M Pattern','W Pattern','Liquidity Sweep','BOS / CHoCH'];
  const user=Array.isArray(state.settings.setupOptions)?state.settings.setupOptions:[];
  return [...new Set([...base,...user].map(x=>String(x||'').trim()).filter(Boolean))];
}
function setupSelect(name,value=''){
  return `<select name="${name}"><option value="">— เลือกแผน —</option>${setupOptions().map(x=>`<option value="${esc(x)}" ${value===x?'selected':''}>${esc(x)}</option>`).join('')}<option value="__OTHER__">อื่น ๆ / เพิ่มใหม่</option></select>`;
}
function setupAnalytics(trades){
  const asset=new Map(), setup=new Map(), matrix=new Map();
  for(const t of trades){
    const a=(t.symbol||'—').toUpperCase(), s=t.setup||'ไม่ระบุ';
    if(!asset.has(a))asset.set(a,[]); asset.get(a).push(t);
    if(!setup.has(s))setup.set(s,[]); setup.get(s).push(t);
    const k=a+'||'+s;if(!matrix.has(k))matrix.set(k,[]);matrix.get(k).push(t);
  }
  const rows=(mp,arrLabel)=>
    [...mp.entries()].map(([k,v])=>({label:k,m:metrics(v),trades:v})).sort((a,b)=>b.m.net-a.m.net);
  return {asset:rows(asset),setup:rows(setup),matrix:[...matrix.entries()].map(([k,v])=>({label:k.split('||'),m:metrics(v),trades:v})).sort((a,b)=>b.m.net-a.m.net)};
}
function setupStatsTable(title,rows){
  return `<section class="card"><div class="card-head"><h3>${esc(title)}</h3></div>${rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>กลุ่ม</th><th>ไม้</th><th>Winrate</th><th>PF</th><th>Expectancy</th><th>P&L</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${Array.isArray(r.label)?r.label.map(esc).join(' × '):esc(r.label)}</b></td><td>${r.m.total}</td><td>${(r.m.winrate*100).toFixed(1)}%</td><td>${Number.isFinite(r.m.profitFactor)?r.m.profitFactor.toFixed(2):'∞'}</td><td class="${r.m.expectancy>=0?'pos':'neg'}">${signed(r.m.expectancy,state.settings.currency)}</td><td class="${r.m.net>=0?'pos':'neg'}"><b>${signed(r.m.net,state.settings.currency)}</b></td></tr>`).join('')}</tbody></table></div>`:'<div class="muted">ยังไม่มีข้อมูล</div>'}</section>`;
}
function setupManager(){
  const opts=setupOptions();
  const standard=new Set(['QM','Double Top','Double Bottom','M Pattern','W Pattern','Liquidity Sweep','BOS / CHoCH']);
  const c=openModal(`<div class="modal-head"><h3>🧩 จัดการแผนเข้าเทรด / Setup</h3><button class="iconbtn" data-x>✕</button></div>

  <div class="row" style="margin-top:12px"><input id="newSetup" placeholder="ชื่อแผนใหม่ เช่น FVG + OB" style="flex:1;border:1px solid var(--line);background:var(--bg2);color:var(--text);padding:9px;border-radius:10px"><button class="btn primary" id="addSetup">เพิ่ม</button></div>
  <div class="stack" style="margin-top:12px">${opts.map(x=>`<div class="row between" style="border:1px solid var(--line);border-radius:10px;padding:8px 10px"><span>${esc(x)}</span>${standard.has(x)?'<span class="pill">มาตรฐาน</span>':`<button class="btn danger small" data-remove-setup="${esc(x)}">ลบ</button>`}</div>`).join('')}</div>
  <div class="modal-foot"><button class="btn" data-x>เสร็จ</button></div>`);
  $$('[data-x]',c).forEach(b=>b.onclick=closeModal);
  $('#addSetup',c).onclick=async()=>{
    const v=$('#newSetup',c).value.trim(); if(!v)return;
    state.settings.setupOptions=[...new Set([...setupOptions(),v])];
    await put('settings',{key:'setupOptions',value:state.settings.setupOptions});
    closeModal(); setupManager(); render();
  };
  $$('[data-remove-setup]',c).forEach(b=>b.onclick=async()=>{
    state.settings.setupOptions=setupOptions().filter(x=>x!==b.dataset.removeSetup);
    await put('settings',{key:'setupOptions',value:state.settings.setupOptions});
    closeModal(); setupManager(); render();
  });
}

 <section class="card"><div class="card-head"><h2>🧩 แผนเข้าเทรด / Setup</h2><button class="btn small" id="manageSetups">จัดการ</button></div><div class="small muted" style="line-height:1.7">รายการเริ่มต้น: QM, Double Top, Double Bottom, M Pattern, W Pattern, Liquidity Sweep, BOS / CHoCH และเพิ่มแผนของคุณเองได้</div></section>
 <section class="card"><div class="card-head"><h2>☁️ Google Drive</h2><span class="small muted">${s.lastSync?`ซิงค์ล่าสุด ${new Date(s.lastSync).toLocaleString('th-TH')}`:'ยังไม่เคยซิงค์'}</span></div><div class="stack"><label class="field"><span>OAuth Client ID</span><input id="driveClientId" value="${esc(s.driveClientId||'')}" placeholder="xxxx.apps.googleusercontent.com"></label><div class="row"><button class="btn primary" id="syncNow">☁️ ซิงค์เดี๋ยวนี้</button><button class="btn" id="driveOut">ออกจาก Google</button></div><details><summary>วิธีตั้งค่า Google Drive</summary><div class="small muted" style="margin-top:8px;line-height:1.7">สร้างโปรเจกต์ใน Google Cloud Console → เปิด Google Drive API → OAuth consent screen → เพิ่มบัญชีของคุณเป็น Test user → สร้าง OAuth Client ID แบบ Web application → ใส่ Authorized JavaScript origins เป็น <code>${esc(location.origin)}</code> → นำ Client ID มาวางตรงนี้ สิทธิ์ที่แอปขอคือ <code>drive.file</code></div></details></div></section>
 <section class="card"><div class="card-head"><h2>🤖 อ่านภาพ MT5 ด้วย AI</h2></div><div class="formgrid"><label class="field full"><span>Claude API key</span><input id="claudeKey" type="password" value="${esc(s.claudeKey||'')}" placeholder="sk-ant-…" autocomplete="off"></label><label class="field"><span>Claude model</span><input id="claudeModel" value="${esc(s.claudeModel||'claude-3-5-sonnet-latest')}"></label><label class="field full"><span>Gemini API key</span><input id="geminiKey" type="password" value="${esc(s.geminiKey||'')}" placeholder="AIza…" autocomplete="off"></label><label class="field"><span>Gemini model</span><input id="geminiModel" value="${esc(s.geminiModel||'gemini-3.8-flash')}"></label></div><div class="notice" style="margin-top:12px">API keys เก็บใน browser เครื่องนี้เท่านั้น ตัว key จะถูกส่งออกเฉพาะเมื่อคุณกดใช้ AI ไปยัง Anthropic หรือ Google ตามบริการที่เลือก</div></section>
 <section class="card"><div class="card-head"><h2>🔒 ความเป็นส่วนตัว</h2></div><div class="small muted" style="line-height:1.7">โหมดปกติ: IndexedDB ใน browser • ไม่มี Analytics • ไม่มี database ของผู้พัฒนา • Backup เป็นไฟล์ JSON ของคุณเอง • Google Drive และ AI เป็นการเชื่อมต่อเสริมที่คุณเปิดใช้เอง • อย่าเก็บ MT5 password, broker password, API secret, private key หรือ seed phrase ในแอป</div></section></div>`;
 $('#theme').onchange=e=>{s.theme=e.target.value;document.documentElement.dataset.theme=s.theme;put('settings',{key:'theme',value:s.theme})};
 [['currency','currency'],['startingBalance','startingBalance'],['driveClientId','driveClientId'],['driveFolderName','driveFolderName'],['claudeKey','claudeKey'],['claudeModel','claudeModel'],['geminiKey','geminiKey'],['geminiModel','geminiModel'],['timeOffsetHours','timeOffsetHours']].forEach(([id,k])=>{$('#'+id).addEventListener('change',async e=>{s[k]=id==='startingBalance'?num(e.target.value):id==='timeOffsetHours'?Math.round(num(e.target.value)*60):e.target.value;await put('settings',{key:k,value:s[k]})})});
 $('#exportSet').onclick=exportBackup;$('#importSet').onclick=importBackup;$('#syncNow').onclick=driveSync;$('#driveOut').onclick=driveSignOut;$('#manageSetups').onclick=setupManager;
}
function exportData(includeImages=true){return Promise.all([all('days'),all('images')]).then(async([days,imgs])=>{const safeSettings={};for(const k of ['currency','startingBalance','theme','driveFolderName','lastSymbol','setupOptions','timeOffsetMinutes','syncRevision'])if(state.settings[k]!==undefined)safeSettings[k]=state.settings[k];const out={version:3,app:'Trade Memo Private',exportedAt:new Date().toISOString(),settings:safeSettings,days,images:imgs.map(i=>({id:i.id,date:i.date,kind:i.kind,name:i.name,type:i.type,createdAt:i.createdAt})),imageData:{}};if(includeImages)for(const i of imgs)out.imageData[i.id]=await blob64(i.blob);return out})}
async function exportBackup(){try{const data=await exportData(true);const blob=new Blob([JSON.stringify(data)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`trade-memo-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('ดาวน์โหลดไฟล์สำรองแล้ว','ok')}catch(e){toast('สำรองไม่สำเร็จ: '+e.message,'err')}}
async function importBackup(){const i=document.createElement('input');i.type='file';i.accept='application/json';i.onchange=async()=>{const f=i.files[0];if(!f)return;try{const data=JSON.parse(await f.text());for(const d of data.days||[]){const local=await get('days',d.date);if(!local||num(d.updatedAt)>=num(local.updatedAt))await put('days',d)}for(const im of data.images||[]){if(await get('images',im.id))continue;const b64=data.imageData?.[im.id];if(!b64)continue;const bin=atob(b64),arr=new Uint8Array(bin.length);for(let j=0;j<bin.length;j++)arr[j]=bin.charCodeAt(j);await put('images',{...im,blob:new Blob([arr],{type:im.type||'image/png'})})}for(const [k,v] of Object.entries(data.settings||{}))await put('settings',{key:k,value:v});await loadData();render();toast('นำเข้าไฟล์สำรองเรียบร้อย','ok')}catch(e){toast('นำเข้าไม่สำเร็จ: '+e.message,'err')}};i.click()}

let gToken=null,gExp=0,gClient=null;
function loadGIS(){if(window.google?.accounts?.oauth2)return Promise.resolve();return new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.defer=true;s.onload=res;s.onerror=()=>rej(new Error('โหลด Google Identity ไม่สำเร็จ'));document.head.appendChild(s)})}
async function driveToken(){const id=state.settings.driveClientId;if(!id)throw new Error('ยังไม่ได้ใส่ Google OAuth Client ID');if(gToken&&Date.now()<gExp-60000)return gToken;await loadGIS();return new Promise((res,rej)=>{gClient=google.accounts.oauth2.initTokenClient({client_id:id,scope:'https://www.googleapis.com/auth/drive.file',callback:r=>{if(r.error)return rej(new Error(r.error_description||r.error));gToken=r.access_token;gExp=Date.now()+(Number(r.expires_in)||3600)*1000;res(gToken)},error_callback:e=>rej(new Error(e.message||e.type||'auth error'))});gClient.requestAccessToken({prompt:''})})}
async function driveApi(path,opt={}){const q=new URLSearchParams(opt.query||{}).toString(),url=(path.startsWith('http')?path:'https://www.googleapis.com/drive/v3'+path)+(q?'?'+q:'');const r=await fetch(url,{method:opt.method||'GET',headers:{Authorization:'Bearer '+gToken,...(opt.headers||{})},body:opt.body});if(!r.ok)throw new Error('Drive '+r.status);return opt.raw?r:r.json()}
async function driveUpload(meta,blob,id){const b='tm'+Math.random().toString(36).slice(2),head=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: ${blob.type||'application/octet-stream'}\r\n\r\n`,body=new Blob([head,blob,`\r\n--${b}--`]);return driveApi('https://www.googleapis.com/upload/drive/v3/files'+(id?'/'+id:''),{method:id?'PATCH':'POST',query:{uploadType:'multipart',fields:'id,name,modifiedTime'},headers:{'Content-Type':`multipart/related; boundary=${b}`},body})}
async function driveFind(name,parent,mime){let q=`name = '${name.replace(/'/g,"\\\\'")}' and trashed = false`;if(parent)q+=` and '${parent}' in parents`;if(mime)q+=` and mimeType = '${mime}'`;const r=await driveApi('/files',{query:{q,fields:'files(id,name,modifiedTime,size)',pageSize:10,spaces:'drive'}});return r.files?.[0]||null}
async function driveFolder(name,parent){const f=await driveFind(name,parent,'application/vnd.google-apps.folder');if(f)return f.id;const meta={name,mimeType:'application/vnd.google-apps.folder'};if(parent)meta.parents=[parent];const r=await driveApi('/files',{method:'POST',query:{fields:'id'},headers:{'Content-Type':'application/json'},body:JSON.stringify(meta)});return r.id}
async function driveList(parent){const r=await driveApi('/files',{query:{q:`'${parent}' in parents and trashed = false`,fields:'files(id,name,modifiedTime,size,mimeType)',pageSize:1000,spaces:'drive',orderBy:'modifiedTime desc'}});return r.files||[]}
async function driveDownload(fileId){const r=await driveApi(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(fileId)}?alt=media`,{method:'GET',raw:true});return await r.text()}
async function driveDownloadBlob(fileId){const r=await driveApi(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(fileId)}?alt=media`,{method:'GET',raw:true});return await r.blob()}
async function driveResolveRoot(){if(state.settings.driveRootId){try{const r=await driveApi('/files/'+encodeURIComponent(state.settings.driveRootId),{query:{fields:'id,name,mimeType,trashed'}});if(r&&r.id&&!r.trashed)return r.id}catch(_){}}const roots=await driveList('root');const candidates=roots.filter(f=>f.mimeType==='application/vnd.google-apps.folder'&&f.name===(state.settings.driveFolderName||'Trade Memo'));let best=null;for(const folder of candidates){const fs=await driveList(folder.id),df=fs.find(f=>f.name==='trade-memo-data.json');if(df&&(!best||new Date(df.modifiedTime)>new Date(best.df.modifiedTime)))best={folder,df};}const id=best?best.folder.id:await driveFolder(state.settings.driveFolderName||'Trade Memo');await saveScalarSetting('driveRootId',id);return id}
function mergeDays(localDays,remoteDays){const map=new Map(localDays.map(d=>[d.date,d]));for(const rd of (remoteDays||[])){const ld=map.get(rd.date);if(!ld||num(rd.updatedAt)>num(ld.updatedAt))map.set(rd.date,rd)}return [...map.values()].sort((a,b)=>a.date.localeCompare(b.date))}
async function driveSync(){try{await driveToken();toast('กำลังอ่านข้อมูลล่าสุดจาก Google Drive…');const root=await driveResolveRoot(),files=await driveList(root),df=files.find(f=>f.name==='trade-memo-data.json'),localData=await exportData(false);let remoteData=null;if(df)try{remoteData=JSON.parse(await driveDownload(df.id))}catch(_){}const mergedDays=mergeDays(localData.days,remoteData?.days||[]);for(const d of mergedDays)await put('days',d);state.days=mergedDays;if(remoteData?.settings){const rs=remoteData.settings,lv=num(state.settings.syncRevision),rv=num(rs.syncRevision);if(rv>=lv)for(const k of Object.keys(rs))if(!['driveRootId','driveImagesId','driveClientId','claudeKey','claudeModel','geminiKey','geminiModel','lastSync'].includes(k))state.settings[k]=rs[k];state.settings.setupOptions=[...new Set([...setupOptions(),...(rs.setupOptions||[])])]}state.settings.syncRevision=Math.max(Date.now(),num(remoteData?.settings?.syncRevision)+1);const merged={version:3,app:'Trade Memo Private',exportedAt:new Date().toISOString(),settings:{currency:state.settings.currency,startingBalance:state.settings.startingBalance,theme:state.settings.theme,driveFolderName:state.settings.driveFolderName,lastSymbol:state.settings.lastSymbol,setupOptions:setupOptions(),timeOffsetMinutes:state.settings.timeOffsetMinutes,syncRevision:state.settings.syncRevision},days:mergedDays,images:[...new Map([...(remoteData?.images||[]),...(localData.images||[])].map(im=>[im.id,im])).values()],imageData:{}};await put('settings',{key:'syncRevision',value:state.settings.syncRevision});const blob=new Blob([JSON.stringify(merged)],{type:'application/json'});if(df)await driveUpload({name:'trade-memo-data.json'},blob,df.id);else await driveUpload({name:'trade-memo-data.json',parents:[root]},blob);const imgFolder=await driveFolder('images',root);await saveScalarSetting('driveImagesId',imgFolder);const remoteImgs=await driveList(imgFolder),haveRemote=new Set(remoteImgs.map(f=>f.name));for(const im of await all('images')){const ext=(im.type||'image/png').split('/')[1].replace('jpeg','jpg'),name=`${im.id}.${ext}`;if(!haveRemote.has(name))await driveUpload({name,parents:[imgFolder]},im.blob)}const localImgs=await all('images'),haveLocal=new Set(localImgs.map(x=>x.id)),remoteMeta=new Map((remoteData?.images||[]).map(x=>[x.id,x]));for(const f of await driveList(imgFolder)){const m=f.name.match(/^(.+)\.(png|jpg|jpeg|webp|gif)$/i);if(!m||haveLocal.has(m[1]))continue;try{const b=await driveDownloadBlob(f.id),meta=remoteMeta.get(m[1])||{};await put('images',{id:m[1],date:meta.date||'',kind:meta.kind||'mt5',name:meta.name||f.name,type:meta.type||b.type||f.mimeType,createdAt:meta.createdAt||new Date(f.modifiedTime).getTime()||Date.now(),blob:b})}catch(_){} }state.settings.lastSync=new Date().toISOString();await put('settings',{key:'lastSync',value:state.settings.lastSync});await loadData();await render();toast('Sync สำเร็จ: รวมข้อมูลล่าสุดจาก iMac/iPhone แล้ว','ok')}catch(e){toast('Sync ไม่สำเร็จ: '+e.message,'err')}}
function driveSignOut(){if(gToken&&window.google)google.accounts.oauth2.revoke(gToken,()=>{});gToken=null;gExp=0;toast('ออกจาก Google แล้ว','ok')}

window.addEventListener('hashchange',()=>{const h=location.hash.replace(/^#\/?/,'');const [v,d]=h.split('/');state.view=['diary','dashboard','settings'].includes(v)?v:'diary';if(state.view==='diary'&&/^\d{4}-\d{2}-\d{2}$/.test(d||''))state.date=d;render()});
document.addEventListener('paste',e=>{const img=[...(e.clipboardData?.items||[])].find(x=>x.type.startsWith('image/'));if(img){const b=img.getAsFile();if(!b)return;if(state.view==='diary'){const card=$('#modalCard');if(!$('#modal').hidden&&card._onPaste){card._onPaste(b);e.preventDefault()}}}});
async function boot(){await loadData();const h=location.hash.replace(/^#\/?/,'');const [v,d]=h.split('/');state.view=['diary','dashboard','settings'].includes(v)?v:'diary';if(state.view==='diary'&&/^\d{4}-\d{2}-\d{2}$/.test(d||''))state.date=d;await render()}
boot();
})();
</script>
