<style>

.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}

.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 12px;border-radius:10px}.btn:hover{background:var(--card2)}.btn.primary{background:var(--accent);border-color:transparent;color:#07111f;font-weight:750}.btn.soft{background:color-mix(in srgb,var(--accent) 12%,var(--card))}.btn.danger{background:color-mix(in srgb,var(--neg) 11%,var(--card));border-color:color-mix(in srgb,var(--neg) 40%,var(--line));color:var(--neg)}.btn.small{padding:7px 10px;font-size:12px}.iconbtn{width:38px;height:38px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px}

.modal{position:fixed;inset:0;background:rgba(4,8,15,.72);display:grid;place-items:center;padding:18px;z-index:100}.modal[hidden]{display:none}.modal-card{width:min(740px,100%);max-height:92vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}.modal-card.wide{width:min(1120px,100%)}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.notice{border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));background:color-mix(in srgb,var(--warn) 9%,var(--card));padding:11px;border-radius:12px;font-size:12px;line-height:1.55}
.toast{position:fixed;right:16px;bottom:16px;z-index:200;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 13px;box-shadow:var(--shadow);font-size:12px}.toast.ok{border-color:color-mix(in srgb,var(--pos) 45%,var(--line))}.toast.err{border-color:color-mix(in srgb,var(--neg) 45%,var(--line))}
details{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg2)}summary{cursor:pointer;color:var(--muted)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
hr{border:0;border-top:1px solid var(--line);margin:4px 0}
@media(max-width:1100px){.tiles{grid-template-columns:repeat(2,1fr)}.tile.hero{grid-column:span 2}.grid4{grid-template-columns:repeat(2,1fr)}}
.import-files{display:flex;gap:8px;flex-wrap:wrap}.import-count{font-size:12px;color:var(--muted)}.preview-wrap{max-height:58vh;overflow:auto;border:1px solid var(--line);border-radius:12px}.progress-note{font-size:12px;color:var(--muted);padding:9px 0}@media(max-width:850px){.shell{grid-template-columns:1fr}.sidebar{position:sticky;bottom:0;top:auto;height:auto;z-index:90;border-right:0;border-top:1px solid var(--line);padding:7px}.brand,.side-note{display:none}.nav{grid-template-columns:repeat(3,1fr)}.nav button{text-align:center;padding:9px 6px;font-size:12px}.main{padding:14px}.grid2,.grid3{grid-template-columns:1fr}.dayhead{grid-template-columns:38px 1fr 38px}.dayhead input{grid-column:2}.periodnav .lbl{min-width:140px}.formgrid{grid-template-columns:1fr}}

.position-details{margin:8px 0;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0;overflow:hidden}.position-details>summary{list-style:disclosure-closed;padding:12px;background:var(--card2);color:var(--text)}.position-details[open]>summary{list-style:disclosure-open;border-bottom:1px solid var(--line)}.position-summary{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center}.position-summary .p-title{font-weight:800}.position-summary .p-meta{font-size:11px;color:var(--muted);line-height:1.5}.position-summary .p-net{text-align:right;font-weight:850}.parts-table{width:100%;border-collapse:collapse;min-width:640px}.parts-table th,.parts-table td{font-size:11px;padding:8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.parts-table th{color:var(--muted);font-weight:600}.part-badges{display:flex;flex-wrap:wrap;gap:4px}.part-badge{font-size:10px;border:1px solid var(--line);border-radius:999px;padding:2px 6px;display:inline-block}.part-badge.full{color:var(--pos);border-color:color-mix(in srgb,var(--pos) 55%,var(--line))}.part-badge.partial{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}.part-badge.overnight{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}.sync-note{font-size:11px;color:var(--muted);margin-top:8px}


.info-tip{display:block;margin:0 0 8px;border:0;background:transparent;padding:0}.info-tip>summary{display:inline-flex;align-items:center;gap:2px;list-style:none;padding:4px 0;color:var(--muted);font-size:12px}.info-tip>summary::-webkit-details-marker{display:none}.info-tip .info-tip-text{font-size:12px;color:var(--muted);line-height:1.55;padding:9px 11px;border:1px solid var(--line);background:var(--card2);border-radius:9px;margin:5px 0 10px}
/* V10: restrained typography and consistent line icons */
.ui-icon{display:inline-block;vertical-align:-3px;flex:none;margin-right:5px}
.nav .ui-icon{margin-right:8px;vertical-align:-3px}
.card-head h2 .ui-icon,.card-head h3 .ui-icon,.top h1 .ui-icon{margin-right:7px}
.small{font-size:13px}.tiny{font-size:12px}.field span{font-size:13px}.pill{font-size:12px}.weekstrip .v,.cal .head span,.calcell .d{font-size:12px}.btn.small{font-size:13px}
.table th,.table td{font-size:13px}.table .subcell{font-size:12px}.trade-row .meta{font-size:12px}.trade-row .move{font-size:12px}
.analysis-note{font-size:12px}.tile .l,.tile .s{font-size:12px}.tile .v{font-size:21px}
.parts-table{min-width:1030px}.parts-table th,.parts-table td{font-size:12px;vertical-align:top;white-space:nowrap}
.parts-table .part-note{min-width:180px;max-width:300px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text);line-height:1.45}

.position-note-preview strong{color:var(--text);font-weight:650;margin-right:5px}.position-mini-stats{display:flex;gap:8px;flex-wrap:wrap}
.movement-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0 12px}

.movement-summary .movement-label{display:block;color:var(--muted);font-size:12px;margin-bottom:3px}
.movement-summary .movement-value{display:block;font-weight:750;font-size:13px;overflow-wrap:anywhere}

</style>

<script>
(() => {
'use strict';

const DB = 'trade-memo-private-v2';
const VER = 1;
const DEFAULT_TIME_OFFSET_MINUTES = 420; // Thailand UTC+7
const fmtDate = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today = () => fmtDate(new Date());
const parseDate = s => { const [y,m,d]=String(s||'').split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const monday = d => { const x=new Date(d); const n=(x.getDay()+6)%7; x.setDate(x.getDate()-n); x.setHours(0,0,0,0); return x; };
const THM=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const THMF=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const THD=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์'];
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (n,cur) => { if(!Number.isFinite(Number(n))) return '∞'; const x=Number(n); return `${x<0?'-':''}${Math.abs(x).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}${cur?' '+cur:''}`; };
const signed=(n,cur)=>`${Number(n)>0?'+':''}${money(n,cur)}`;
const num=(x)=>{const n=Number(x);return Number.isFinite(n)?n:0};
// ราคาที่บันทึกในระบบใช้ทศนิยมสูงสุด 3 ตำแหน่ง โดย 'ตัด' เศษส่วนที่เกินออก ไม่ปัดขึ้น
const truncate3=(x)=>{const n=Number(x);if(!Number.isFinite(n))return 0;return Math.trunc(n*1000)/1000};
const price3=(x)=>truncate3(x).toFixed(3);
const clock3=(x)=>{const m=String(x??'').trim().match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?/);return m?`${String(m[1]).padStart(2,'0')}:${m[2]}:${m[3]||'00'}`:''};
const dateTimeLabel=(date,time,fallbackDate='')=>{const d=String(date||fallbackDate||'').trim();const tm=clock3(time);return d?(tm?`${d} ${tm}`:d):(tm||'วันที่/เวลาไม่ระบุ')};
const tradeSourceDateKnown=(t,kind)=>{const flag=t?.[`${kind}DateKnown`];if(typeof flag==='boolean')return flag;const rawDate=t?.[kind==='entry'?'rawEntryDate':'rawExitDate'];const rawDateTime=t?.[kind==='entry'?'rawEntryTime':'rawExitTime'];if(t?.importSource&&(rawDate!==undefined||rawDateTime!==undefined))return !!parseDatePart(rawDate,'')||!!parseDatePart(rawDateTime,'');return true};
const tradeDateLabel=(t,kind,fallbackDate='')=>!tradeSourceDateKnown(t,kind)?'ไม่พบวันที่ในต้นฉบับ':String(t?.[`${kind}Date`]||t?.date||fallbackDate||'วันที่ไม่ระบุ');
const tradeDateTimeLabel=(t,kind,fallbackDate='')=>{const tm=clock3(t?.[`${kind}Time`]);return !tradeSourceDateKnown(t,kind)?`${tm||'เวลาไม่ระบุ'} · ไม่พบวันที่ในต้นฉบับ`:dateTimeLabel(t?.[`${kind}Date`],t?.[`${kind}Time`],fallbackDate)};
const tradeChronologyKey=(t,fallbackDate='')=>{const d=String(t?.entryDate||t?.date||fallbackDate||t?.exitDate||'9999-12-31');const tm=clock3(t?.entryTime)||clock3(t?.exitTime)||'99:99:99';const created=String(num(t?.createdAt)||0).padStart(16,'0');return `${d} ${tm} ${created}`};
const sortTradesChronological=(trades,fallbackDate='')=>[...(trades||[])].sort((a,b)=>tradeChronologyKey(a,fallbackDate).localeCompare(tradeChronologyKey(b,fallbackDate)));
const uid=()=>crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`;
const $=(q,r=document)=>r.querySelector(q), $$=(q,r=document)=>[...r.querySelectorAll(q)];
const UI_ICON_PATHS={
 book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v17H6.5A2.5 2.5 0 0 0 4 22z"/><path d="M4 5.5V22"/><path d="M8 7h8M8 11h8"/>',

function metrics(trades){
 const nets=trades.map(tradeNet), wins=nets.filter(n=>n>0), losses=nets.filter(n=>n<0);
 const grossWin=wins.reduce((a,b)=>a+b,0), grossLoss=Math.abs(losses.reduce((a,b)=>a+b,0));
 let peak=0,cum=0,maxDD=0,curW=0,curL=0,maxW=0,maxL=0;
 nets.forEach(n=>{cum+=n;if(cum>peak)peak=cum;maxDD=Math.max(maxDD,peak-cum);if(n>0){curW++;curL=0}else if(n<0){curL++;curW=0}else{curW=0;curL=0}maxW=Math.max(maxW,curW);maxL=Math.max(maxL,curL)});
 const decided=wins.length+losses.length, net=grossWin-grossLoss;
 return {total:trades.length,wins:wins.length,losses:losses.length,be:nets.filter(n=>n===0).length,winrate:decided?wins.length/decided:0,grossWin,grossLoss,net,
 profitFactor:grossLoss?grossWin/grossLoss:(grossWin?Infinity:0),expectancy:trades.length?net/trades.length:0,
 avgWin:wins.length?grossWin/wins.length:0,avgLoss:losses.length?grossLoss/losses.length:0,rr:losses.length?(wins.length?grossWin/wins.length/(grossLoss/losses.length):0):(grossWin?Infinity:0),
 maxDD,maxWinStreak:maxW,maxLossStreak:maxL,best:nets.length?Math.max(...nets):0,worst:nets.length?Math.min(...nets):0,lots:trades.reduce((a,t)=>a+num(t.lots),0)}
}

function isoWeek(d){const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-day);const ys=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil((((x-ys)/86400000)+1)/7)}
function shift(period,anchor,dir){const a=parseDate(anchor);if(period==='day')return fmtDate(addDays(a,dir));if(period==='week')return fmtDate(addDays(a,7*dir));if(period==='month')return fmtDate(new Date(a.getFullYear(),a.getMonth()+dir,Math.min(a.getDate(),28)));if(period==='year')return fmtDate(new Date(a.getFullYear()+dir,a.getMonth(),Math.min(a.getDate(),28)));return anchor}

function timeSlotForTrade(t){
 const m=String(t?.entryTime||'').trim().match(/^(\d{1,2}):(\d{2})/);
 if(!m)return {key:'unknown',label:'ไม่ระบุเวลา',order:99};
 const hour=Number(m[1]);if(hour<0||hour>23||Number(m[2])<0||Number(m[2])>59)return {key:'unknown',label:'ไม่ระบุเวลา',order:99};
 const start=Math.floor(hour/4)*4,end=start+3;
 const pad=n=>String(n).padStart(2,'0');
 return {key:String(start).padStart(2,'0'),label:`${pad(start)}:00–${pad(end)}:59`,order:start};
}

}

function pipSizeManager(){
 const usedSymbols=[...new Set([...(state.settings.pipSizeBySymbol?Object.keys(state.settings.pipSizeBySymbol):[]),...state.days.flatMap(d=>(d.trades||[]).map(t=>baseSymbol(t.symbol))).filter(Boolean)])].sort();
 const row=(symbol='',size='')=>`<div class="formgrid pip-rule" style="padding:10px 0;border-bottom:1px solid var(--line);align-items:end"><label class="field"><span>Symbol (เช่น XAUUSD)</span><input data-pip-symbol value="${esc(symbol)}" placeholder="XAUUSD"></label><label class="field"><span>ราคาเปลี่ยนเท่าไร = 1 Pip</span><input data-pip-size type="number" min="0.00000001" step="any" value="${size!==''?esc(size):''}" placeholder="เช่น 0.01"></label></div>`;
 const c=openModal(`<div class="modal-head"><h3>${uiIcon('ruler')}ตั้งค่าขนาด Pip ต่อสินทรัพย์</h3><button class="iconbtn" data-pip-close>✕</button></div><p class="analysis-note">ขนาด Pip แตกต่างกันตามสัญลักษณ์และข้อกำหนดของโบรกเกอร์ ค่าเริ่มต้น: XAU/GOLD = 0.01, คู่ Forex 6 ตัวอักษรทั่วไป = 0.0001, คู่ที่ลงท้าย JPY = 0.01 และสินทรัพย์อื่น = 0.01 กรุณาตรวจสอบค่าของ Symbol ที่โบรกเกอร์ใช้</p><div id="pipRows">${usedSymbols.map(s=>row(s,(state.settings.pipSizeBySymbol||{})[s]??defaultPipSize(s))).join('')}</div><div class="row" style="margin-top:12px"><button class="btn" id="addPipRule">＋ เพิ่ม Symbol</button></div><div class="modal-foot"><button class="btn" data-pip-close>ยกเลิก</button><button class="btn primary" id="savePipRules">บันทึกขนาด Pip</button></div>`,true);
 if(!usedSymbols.length)$('#pipRows',c).innerHTML=row('XAUUSD',0.01);
 $$('[data-pip-close]',c).forEach(b=>b.onclick=closeModal);
 $('#addPipRule',c).onclick=()=>$('#pipRows',c).insertAdjacentHTML('beforeend',row('',''));
 $('#savePipRules',c).onclick=async()=>{
  const next={};
  for(const r of $$('.pip-rule',c)){
   const s=baseSymbol($('[data-pip-symbol]',r).value),v=num($('[data-pip-size]',r).value);
   if(!s&&!String($('[data-pip-size]',r).value||'').trim())continue;
   if(!s||!(v>0)){toast('กรุณาระบุ Symbol และขนาด Pip ที่มากกว่า 0 ให้ครบ','err');return}
   if(next[s]!==undefined){toast(`มี Symbol ${s} ซ้ำ กรุณาแก้ให้เหลือรายการเดียว`,'err');return}
   next[s]=v;
  }
  state.settings.pipSizeBySymbol=next;await saveScalarSetting('pipSizeBySymbol',next);closeModal();toast('บันทึกขนาด Pip แล้ว','ok');render();
 };
}

async function tradeListHtml(trades,date){
 const dayParts=(trades||[]).map(t=>({...t,date,exitDate:t.exitDate||date}));
 if(!dayParts.length)return '<div class="muted">ยังไม่มีออเดอร์ปิดในวันนี้</div>';
 const activeIds=new Set(dayParts.map(t=>t.id));
 const allParts=flattenDayTrades(state.days);
 // Include unsaved/current-day objects if the page is being rendered immediately after a write.
 for(const t of dayParts)if(!allParts.some(x=>x.id===t.id))allParts.push(t);
 const positions=groupPositionTrades(allParts).filter(pos=>pos.parts.some(part=>activeIds.has(part.id)||String(part.date||'')===date));
 positions.sort((a,b)=>String(a.entryDate+' '+clock3(a.entryTime)).localeCompare(String(b.entryDate+' '+clock3(b.entryTime))));
 return positions.map(pos=>{
  const todayParts=pos.parts.filter(part=>activeIds.has(part.id)||String(part.date||'')===date);
  const todayNet=todayParts.reduce((a,part)=>a+tradeNet(part),0),totalNet=tradeNet(pos);
  const cur=isCent(pos)?state.settings.currency+'c':state.settings.currency;
  const mv=tradeMovement(pos),mvClass=mv?(mv.delta>0?'pos':mv.delta<0?'neg':''):'muted';

  const todayRange=todayParts.length?`ปิดวันนี้ ${todayParts.length} ส่วน · ${signed(todayNet,cur)}`:'ไม่มีส่วนปิดในวันนี้';
  if(closeCount===1){
   const part=pos.parts[0],note=positionNoteText(pos)||part.notes||'',partNote=part.notes&&positionNoteText(pos)&&part.notes!==positionNoteText(pos)?`<div class="meta">โน้ตปิด: ${esc(part.notes)}</div>`:'';
   return `<div class="trade-row"><div><div class="sym">${esc(pos.symbol)}</div><div class="meta">เข้า ${esc(tradeDateTimeLabel(pos,'entry',date))} → ออก ${esc(tradeDateTimeLabel(part,'exit',date))} · ${esc(pos.side||'')} · ${initialLabel}</div>${partBadgesHtml(pos,part)}</div><div><span class="pill">${esc(pos.ticket||'')}</span>${note?`<div class="meta note-inline">${esc(note)}</div>`:''}${partNote}</div><div class="pl ${tradeNet(part)>=0?'pos':'neg'}">${signed(tradeNet(part),cur)}<div class="meta">เข้า ${price3(num(part.entryPrice)>0?part.entryPrice:pos.entryPrice)} → ออก ${price3(part.exitPrice)}</div><div class="move ${mvClass}">Δ ${mv?signedFixed(mv.delta,3):'—'} · ${mv?signedFixed(mv.pips,1)+' pips':'—'}</div><button class="btn small" data-edit="${esc(part.id)}" style="margin-top:5px">${uiIcon('edit',14)}แก้ไข</button></div></div>`;
  }
  return `<details class="position-details"><summary><div class="position-summary"><div><div class="p-title">${esc(pos.symbol)}</div><div class="p-meta">${esc(pos.side||'')} · Ticket ${esc(pos.ticket||'—')}</div></div><div><div class="p-title">เข้า ${esc(tradeDateTimeLabel(pos,'entry',date))}</div><div class="p-meta">${initialLabel} · ${closeCount} ส่วนปิด · ${esc(todayRange)}</div></div><div class="p-net ${todayNet>=0?'pos':'neg'}">วันนี้ ${signed(todayNet,cur)}<div class="p-meta">Position รวม ${signed(totalNet,cur)}</div></div>${positionNotePreviewHtml(pos)}${positionMovementInlineHtml(pos)}</div></summary>${positionPartsTable(pos,cur,true)}</details>`;
 }).join('');
}

function validImportedTrade(t){return !!(t.symbol||t.ticket) && (t.symbol||t.side||t.lots||t.entryTime||t.exitTime||t.pnl||t.entryPrice||t.exitPrice);}
function tradeFingerprint(t){return [t.ticket||'',t.symbol||'',t.side||'',t.entryDate||'',t.entryTime||'',t.exitDate||'',t.exitTime||'',num(t.lots),num(t.entryPrice),num(t.exitPrice),num(t.pnl)].join('|');}
function dedupeTrades(trades){const seen=new Set(),out=[];for(const t of trades){const k=tradeFingerprint(t);if(seen.has(k))continue;seen.add(k);out.push(t)}return out;}
async function saveImportedTrades(trades,source,imagesToSave=[]){
 const clean=dedupeTrades(trades.filter(validImportedTrade));if(!clean.length)throw new Error('ไม่พบแถวที่มีข้อมูลออเดอร์');
 const byDate=new Map();for(const t of clean){const d=t.journalDate||state.date;if(!byDate.has(d))byDate.set(d,[]);byDate.get(d).push(t)}
 let added=0,skipped=0;
 for(const [date,rows] of byDate){const day=await getDay(date);day.deletedTradeIds=day.deletedTradeIds||[];const have=new Set((day.trades||[]).map(tradeFingerprint));let dateAdded=0;for(const t of sortTradesChronological(rows,date)){const now=Date.now();const z={id:uid(),createdAt:now,updatedAt:now,pnl:num(t.pnl),commission:num(t.commission),swap:num(t.swap),lots:num(t.lots),entryPrice:truncate3(t.entryPrice),exitPrice:truncate3(t.exitPrice),...t};z.entryPrice=truncate3(z.entryPrice);z.exitPrice=truncate3(z.exitPrice);z.entryDate=z.entryDate||date;z.exitDate=z.exitDate||date;const fp=tradeFingerprint(z);if(have.has(fp)){skipped++;continue}have.add(fp);day.trades.push(z);dateAdded++;}day.trades=sortTradesChronological(day.trades,date);day.updatedAt=Date.now();await put('days',day);added+=dateAdded}
 for(const {blob,name='MT5 import'} of imagesToSave) await addImage(blob,state.date,'mt5');
 state.day=await getDay(state.date);state.days=await all('days');
 return {added,skipped,dates:[...byDate.keys()].sort()};
}

function buildAITradePrompt(count){return `อ่านประวัติออเดอร์จากภาพ MT5 จำนวน ${count} ภาพเพื่อดึงข้อมูลทุกแถวของออเดอร์ที่ปิดแล้ว ตอบเป็น JSON ตามโครงสร้างที่ระบบกำหนดเท่านั้น ห้ามใส่ markdown/code fence และห้ามสร้าง JSON หลายก้อน. ห้ามใส่ summary/warnings หรือข้อความนอก JSON.
ข้อสำคัญ:
- อ่านทุกออเดอร์ที่มองเห็นในทุกภาพ แม้มีหลายภาพและบางภาพซ้ำกัน; หากเป็นภาพซ้ำของแถวเดิมให้คืนเพียงครั้งเดียว.
- symbol ต้องคงตัวพิมพ์เล็ก c สำหรับพอร์ต Cent เช่น XAUUSDc.
- side ใช้ buy หรือ sell.
- lots, entryPrice, exitPrice, pnl, commission, swap, sl, tp เป็นตัวเลข; ถ้ามองไม่เห็นให้ใช้ 0.
- ticket เป็นข้อความตามที่เห็นในแถว (Ticket/Deal ID).
- positionId ให้คืน Position ID/หมายเลข Position ที่เชื่อมรายการปิดย่อยของ Position เดียวกัน หากภาพแสดง; ถ้าไม่มีให้เป็นสตริงว่าง.
- originalPositionSize คือ Lot เริ่มต้นของ Position ก่อนแบ่งปิด ไม่ใช่ Lot ที่ปิดในแถวนั้น; อ่านเฉพาะเมื่อภาพมีขนาดเริ่มต้นอย่างชัดเจน มิฉะนั้นให้เป็น 0.
- entryAt/exitAt ให้คืนวันและเวลาฉบับเต็มตามที่เห็นในภาพ ก่อนปรับเวลา เช่น YYYY-MM-DD HH:MM:SS.
- entryDate/exitDate ให้คืนวันที่ YYYY-MM-DD ตามแถวเดียวกัน หากภาพมีวันที่แยกคอลัมน์กับเวลาให้จับคู่ให้ถูกต้อง; ถ้าไม่เห็นวันที่จริงให้คืนสตริงว่าง ห้ามเดาวันจากวันปัจจุบัน.
- entryTime/exitTime ให้คืนเวลา HH:MM:SS ตามภาพด้วย แต่ระบบจะใช้ entryAt/exitAt หรือวันที่+เวลาแยกกันเพื่อสร้างวันเวลาที่สมบูรณ์.
- ห้ามเดาค่าที่ไม่เห็น.
- ระบบจะเป็นผู้ปรับเวลา MT5 → เวลาไทย +${(getTimeOffsetMinutes()/60)} ชั่วโมงตอนบันทึก.
`}

function geminiResponseSchema(){return {type:'object',properties:{trades:{type:'array',items:{type:'object',properties:{symbol:{type:'string'},side:{type:'string'},lots:{type:'number'},entryPrice:{type:'number'},exitPrice:{type:'number'},entryDate:{type:'string'},exitDate:{type:'string'},entryAt:{type:'string'},exitAt:{type:'string'},entryTime:{type:'string'},exitTime:{type:'string'},pnl:{type:'number'},commission:{type:'number'},swap:{type:'number'},ticket:{type:'string'},positionId:{type:'string'},originalPositionSize:{type:'number'},sl:{type:'number'},tp:{type:'number'},setup:{type:'string'},notes:{type:'string'}},required:['symbol','side','lots','entryPrice','exitPrice','entryDate','exitDate','entryAt','exitAt','entryTime','exitTime','pnl','commission','swap','ticket','positionId','originalPositionSize','sl','tp','setup','notes']}}},required:['trades']}}
function parseGeminiJson(text){const raw=String(text??'').trim();try{return JSON.parse(raw)}catch(_){const fenced=raw.match(/```(?:json)?\s*([\s\S]*?)\s*```/i);if(fenced)try{return JSON.parse(fenced[1])}catch(e){}const a=raw.indexOf('{'),b=raw.lastIndexOf('}');if(a>=0&&b>a)try{return JSON.parse(raw.slice(a,b+1))}catch(e){}throw new Error('Gemini ส่งข้อมูล JSON ที่อ่านไม่ได้ กรุณาลองใหม่อีกครั้ง')}}
async function geminiGenerate(model,key,parts){
 const endpoint=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`;
 const gemParts=[{text:buildAITradePrompt(parts.length)},...parts.map(x=>({inlineData:{mimeType:x.blob.type||'image/png',data:x.b64}}))];
 const body={contents:[{parts:gemParts}],generationConfig:{maxOutputTokens:6000,responseMimeType:'application/json',responseJsonSchema:geminiResponseSchema()}};
 let r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
 if(!r.ok){let msg='';try{const ej=await r.json();msg=ej?.error?.message||''}catch(_){msg=(await r.text().catch(()=>'' )).slice(0,260)}
  if(r.status===429)throw new Error('Gemini API 429: โควตา/Rate limit ของ Project นี้ถูกใช้เกินกำหนด กรุณารอสักครู่แล้วลองใหม่');
  if(r.status===400&&/response.*schema|json schema|structured/i.test(msg)){
   r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({contents:[{parts:gemParts}],generationConfig:{maxOutputTokens:6000,responseMimeType:'application/json'}})});
   if(!r.ok){let m='';try{const e2=await r.json();m=e2?.error?.message||''}catch(_){m=(await r.text().catch(()=>'' )).slice(0,260)}throw new Error('Gemini API '+r.status+(m?': '+m:''))}
  }else throw new Error('Gemini API '+r.status+(msg?': '+msg:''));
 }
 const j=await r.json();const text=j.candidates?.[0]?.content?.parts?.map(x=>x.text||'').join('')||'';return parseGeminiJson(text)
}

function mergeTradeArrays(localTrades=[],remoteTrades=[],deletedIds=[]){

function mergeDayRecords(local,remote){

function mergeDays(localDays=[],remoteDays=[]){const map=new Map();for(const d of localDays||[])map.set(d.date,d);for(const rd of remoteDays||[])map.set(rd.date,mergeDayRecords(map.get(rd.date),rd));return [...map.values()].sort((a,b)=>a.date.localeCompare(b.date));}
function syncStatus(message){
 const e=$('#toast');if(!e)return;clearTimeout(e._t);e._t=null;e.textContent=message;e.className='toast';e.hidden=false;
}
async function forEachLimit(items,limit,worker,onProgress){
 let next=0,done=0;const errors=[];const count=Math.min(Math.max(1,limit),items.length);
 await Promise.all(Array.from({length:count},async()=>{while(true){const i=next++;if(i>=items.length)return;try{await worker(items[i],i)}catch(error){errors.push({item:items[i],error})}finally{done++;if(onProgress)onProgress(done,items.length,items[i])}}}));
 return {done:items.length,errors};
}
async function driveSync(){
 const started=Date.now();
 try{
  await driveToken();syncStatus('กำลังเตรียม Google Drive Sync…');
  const root=await driveResolveRoot();
  const files=await driveList(root),df=files.find(f=>f.name==='trade-memo-data.json');
  const localData=await exportData(false);let remoteData=null;
  if(df){try{remoteData=JSON.parse(await driveDownload(df.id))}catch(e){throw new Error('อ่าน trade-memo-data.json จาก Drive ไม่สำเร็จ: '+e.message)}}
  syncStatus('กำลังรวมข้อมูล Order และบันทึกข้อมูลหลัก…');
  const mergedDays=mergeDays(localData.days,remoteData?.days||[]);
  // Write the merged day records in parallel; each date is an independent IndexedDB key.
  await Promise.all(mergedDays.map(d=>put('days',d)));state.days=mergedDays;
  if(remoteData?.settings){
   const rs=remoteData.settings;
   for(const k of ['currency','startingBalance','driveFolderName','lastSymbol','setupOptions','timeOffsetMinutes','geminiModel'])if(rs[k]!==undefined)state.settings[k]=rs[k];
   state.settings.setupOptions=[...new Set([...setupOptions(),...(rs.setupOptions||[])])];
   state.settings.pipSizeBySymbol={...(state.settings.pipSizeBySymbol||{}),...(rs.pipSizeBySymbol||{})};
   await Promise.all(Object.entries(rs).filter(([k])=>!['driveRootId','driveImagesId','driveClientId','lastSync','syncRevision'].includes(k)).map(([k,v])=>put('settings',{key:k,value:k==='pipSizeBySymbol'?state.settings.pipSizeBySymbol:v})));
   await saveScalarSetting('pipSizeBySymbol',state.settings.pipSizeBySymbol);
  }
  state.settings.syncRevision=Math.max(Date.now(),num(remoteData?.settings?.syncRevision)+1);await saveScalarSetting('syncRevision',state.settings.syncRevision);
  const imageMeta=[...new Map([...(remoteData?.images||[]),...(localData.images||[])].map(im=>[im.id,im])).values()];
  const merged={version:4,app:'Trade Memo Private',exportedAt:new Date().toISOString(),settings:{currency:state.settings.currency,startingBalance:state.settings.startingBalance,theme:state.settings.theme,driveFolderName:state.settings.driveFolderName,lastSymbol:state.settings.lastSymbol,setupOptions:setupOptions(),timeOffsetMinutes:state.settings.timeOffsetMinutes,syncRevision:state.settings.syncRevision,geminiModel:state.settings.geminiModel,pipSizeBySymbol:state.settings.pipSizeBySymbol||{}},days:mergedDays,images:imageMeta,imageData:{}};
  const blob=new Blob([JSON.stringify(merged)],{type:'application/json'});
  if(df)await driveUpload({name:'trade-memo-data.json'},blob,df.id);else await driveUpload({name:'trade-memo-data.json',parents:[root]},blob);

  const imgFolder=await driveFolder('images',root);await saveScalarSetting('driveImagesId',imgFolder);
  const remoteImgs=await driveList(imgFolder),remoteByName=new Map(remoteImgs.map(f=>[f.name,f]));
  const localImgs=await all('images');
  const pendingUploads=localImgs.map(im=>{const ext=(im.type||'image/png').split('/')[1].replace('jpeg','jpg'),name=`${im.id}.${ext}`;return {im,name}}).filter(x=>!remoteByName.has(x.name));
  const uploadResult=await forEachLimit(pendingUploads,3,async({im,name})=>{
   await driveUpload({name,parents:[imgFolder]},im.blob);
  },(done,total)=>syncStatus(`กำลังอัปโหลดภาพ ${done}/${total}…`));

  const haveLocal=new Set(localImgs.map(x=>x.id)),remoteMeta=new Map((remoteData?.images||[]).map(x=>[x.id,x]));
  const pendingDownloads=remoteImgs.map(f=>{const m=f.name.match(/^(.+)\.(png|jpg|jpeg|webp|gif)$/i);return m?{file:f,id:m[1]}:null}).filter(x=>x&&!haveLocal.has(x.id));
  const downloadResult=await forEachLimit(pendingDownloads,3,async({file,id})=>{
   const b=await driveDownloadBlob(file.id),meta=remoteMeta.get(id)||{};
   await put('images',{id,date:meta.date||'',kind:meta.kind||'mt5',name:meta.name||file.name,type:meta.type||b.type||file.mimeType,createdAt:meta.createdAt||Date.now(),blob:b});
  },(done,total)=>syncStatus(`กำลังดาวน์โหลดภาพ ${done}/${total}…`));

  state.settings.lastSync=new Date().toISOString();await saveScalarSetting('lastSync',state.settings.lastSync);await loadData();await render();
  const secs=Math.max(1,Math.round((Date.now()-started)/1000));
  const failedUploads=uploadResult.errors.length,failedDownloads=downloadResult.errors.length;
  if(failedUploads||failedDownloads){
   toast(`Sync ข้อมูลสำเร็จ (${secs} วินาที) แต่มีภาพที่ยังไม่ครบ: อัปโหลด ${failedUploads}, ดาวน์โหลด ${failedDownloads} รายการ — กด Sync ซ้ำเพื่อลองอีกครั้ง`,'err');
  }else{
   toast(`Sync สำเร็จ (${secs} วินาที): รวมข้อมูล iMac/iPhone แล้ว${pendingUploads.length||pendingDownloads.length?` · ภาพใหม่ ${pendingUploads.length} อัปโหลด / ${pendingDownloads.length} ดาวน์โหลด`:''}`,'ok');
  }
 }catch(e){toast('Sync ไม่สำเร็จ: '+e.message,'err')}
}

function driveSignOut(){if(gToken&&window.google)google.accounts.oauth2.revoke(gToken,()=>{});gToken=null;gExp=0;toast('ออกจาก Google แล้ว','ok')}

window.addEventListener('hashchange',()=>{const h=location.hash.replace(/^#\/?/,'');const [v,d]=h.split('/');state.view=['diary','dashboard','settings'].includes(v)?v:'diary';if(state.view==='diary'&&/^\d{4}-\d{2}-\d{2}$/.test(d||''))state.date=d;render()});
document.addEventListener('paste',e=>{const img=[...(e.clipboardData?.items||[])].find(x=>x.type.startsWith('image/'));if(img){const b=img.getAsFile();if(!b)return;if(state.view==='diary'){const card=$('#modalCard');if(!$('#modal').hidden&&card._onPaste){card._onPaste(b);e.preventDefault()}}}});
async function boot(){await loadData();const h=location.hash.replace(/^#\/?/,'');const [v,d]=h.split('/');state.view=['diary','dashboard','settings'].includes(v)?v:'diary';if(state.view==='diary'&&/^\d{4}-\d{2}-\d{2}$/.test(d||''))state.date=d;await render()}
boot();
})();
</script>
